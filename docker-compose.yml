# Local infrastructure for the online mode. Postgres runs on host port 5433 so it never clashes
# with a Postgres already listening on 5432.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conquistador
      POSTGRES_USER: conquistador
      POSTGRES_PASSWORD: conquistador
    ports:
      - "5433:5432"
    volumes:
      - conquistador-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conquistador -d conquistador"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  conquistador-db:
