# Builds the web version of the game and publishes it to GitHub Pages on every push to master.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Server tests need Postgres (same port as docker-compose locally).
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conquistador
          POSTGRES_USER: conquistador
          POSTGRES_PASSWORD: conquistador
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U conquistador -d conquistador"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Export web build
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export -p web
      - name: SPA fallback for deep links
        run: |
          cp apps/mobile/dist/index.html apps/mobile/dist/404.html
          touch apps/mobile/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
